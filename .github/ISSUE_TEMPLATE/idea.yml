name: Idea
description: Suggest a change. Open one of these before a pull request, so we can agree on it first.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd change
      description: What it is, and why it matters to your app.
    validations:
      required: true
  - type: markdown
    attributes:
      value: New tells aren't accepted yet, because the internals are still moving.
