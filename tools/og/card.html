<!doctype html>
<html
  lang="en"
  class="dark"
>
  <head>
    <meta charset="utf-8" />
    <title>Tiny Tells social card</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@500&family=Schibsted+Grotesk:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="/tools/og/drafting.css"
    />
    <style>
      html,
      body {
        inline-size: 1200px;
        block-size: 630px;
      }
      body {
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      }
      /* At feed size (about 0.45×) a full-strength grid turns to mesh, so it fades out from the middle and reads as paper. */
      .grid {
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 70% 75% at 50% 55%, #000 20%, transparent 100%);
      }
      /* Hand-set like the landing's wordmark: a dotless ı takes the Eyes tell as its tittle, and the tight pairs are kerned by eye. */
      h1 {
        position: absolute;
        inset-block-start: 88px;
        inset-inline-start: 92px;
        margin: 0;
        font-size: 112px;
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }
      .t {
        margin-inline-end: -0.03em;
      }
      .tittle {
        position: relative;
      }
      .tittle tiny-tell {
        position: absolute;
        inset-block-start: -0.02em;
        inset-inline-start: 50%;
        translate: -50% 0;
        --tell-size: 0.44em;
      }
      .gap {
        margin-inline-start: 0.16em;
      }
      .te {
        letter-spacing: -0.06em;
      }
      .lede {
        position: absolute;
        inset-block-start: 212px;
        inset-inline-start: 92px;
        margin: 0;
        font-size: 28px;
        color: color-mix(in oklab, var(--ink) 70%, transparent);
      }
      .cast {
        inset-inline: 92px;
        inset-block-start: 318px;
        --pose: 128px;
        --label-size: 15px;
        --label-gap: 22px;
      }
      .cast figcaption {
        font-family: 'Martian Mono', ui-monospace, monospace;
      }
      .drafting,
      .state {
        --mark-size: 16px;
        font-family: 'Martian Mono', ui-monospace, monospace;
      }
      .state {
        inset-block-end: 102px;
        inset-inline-end: 92px;
        text-transform: none;
        letter-spacing: 0.08em;
      }
      .ruler {
        --ruler-width: 1016px;
        --ruler-height: 18px;
        --ruler-major: 96px;
        --ruler-minor: 24px;
        inset-inline: 92px;
        inset-block-end: 72px;
      }
      .playhead {
        inline-size: 2px;
      }
      .playhead::before {
        inset-inline-start: -5px;
        border-width: 6px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <span
      class="drafting"
      style="left: 92px; top: 48px"
      >12 fld</span
    >
    <span
      class="drafting"
      style="right: 92px; top: 48px"
      >sc. 01 · og</span
    >
    <h1>
      <span class="t">T</span
      ><span class="tittle"
        >ı<tiny-tell
          skin="eyes"
          state="working"
          scheme="light"
          label=""
          data-t="0.9"
        ></tiny-tell></span
      >ny<span class="gap"><span class="te">Te</span>lls</span>
    </h1>
    <p class="lede">Give your app’s status a face.</p>
    <div class="cast">
      <figure>
        <tiny-tell
          skin="drones"
          state="working"
          label=""
          data-t="2.4"
        ></tiny-tell>
        <figcaption>drones</figcaption>
      </figure>
      <figure>
        <tiny-tell
          skin="flipdot"
          state="warning"
          label=""
          data-t="1.07"
        ></tiny-tell>
        <figcaption>flipdot</figcaption>
      </figure>
      <figure>
        <tiny-tell
          skin="eyes"
          state="done"
          label=""
          data-t="1.2"
        ></tiny-tell>
        <figcaption>eyes</figcaption>
      </figure>
      <figure>
        <tiny-tell
          skin="blot"
          state="idle"
          label=""
          data-t="1.2"
        ></tiny-tell>
        <figcaption>blot</figcaption>
      </figure>
      <figure>
        <tiny-tell
          skin="dekatron"
          state="working"
          label=""
          data-t="0.53"
        ></tiny-tell>
        <figcaption>dekatron</figcaption>
      </figure>
      <figure>
        <tiny-tell
          skin="lens"
          state="error"
          label=""
          data-t="0.27"
        ></tiny-tell>
        <figcaption>lens</figcaption>
      </figure>
    </div>
    <span class="state">1 beat · 0.8 s</span>
    <div
      class="ruler"
      style="--progress: 0.58"
    >
      <i class="playhead"></i>
    </div>
    <script>
      window.__TINY_TELLS_VERSION__ = 'card';
    </script>
    <script type="module">
      const parked = [...document.querySelectorAll('tiny-tell')].map(el => [el, el.parentNode, el.nextSibling]);
      parked.forEach(([el]) => el.remove());
      await document.fonts.ready;
      /* Still frames come from one table keyed by state, so each tell connects and draws with its own pose time before the next. */
      const { STILL } = await import('/src/element.js');
      const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      for (const [el, parent, next] of parked) {
        STILL[el.getAttribute('state')] = Number(el.dataset.t);
        parent.insertBefore(el, next);
        await settle();
      }
      document.body.dataset.ready = '';
    </script>
  </body>
</html>
