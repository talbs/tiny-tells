<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tiny-tell play fixture</title>
    <style>
      body {
        margin: 0;
        padding: 200px;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      tiny-tell {
        --tell-size: 48px;
      }
    </style>
    <script
      type="module"
      src="../dist/tiny-tells-play.js"
    ></script>
  </head>
  <body>
    <tiny-tell
      id="eyes"
      skin="eyes"
      state="idle"
    ></tiny-tell>
    <tiny-tell
      id="busy"
      skin="eyes"
      state="working"
    ></tiny-tell>
    <tiny-tell
      id="dance-state"
      skin="eyes"
      state="idle"
      noplay
      style="color: rgb(0 0 230); --tell-color-dance: rgb(230 0 0)"
    ></tiny-tell>
    <tiny-tell
      id="dance-current"
      skin="eyes"
      state="idle"
      color="current"
      noplay
      style="color: rgb(0 0 230); --tell-color-dance: rgb(230 0 0)"
    ></tiny-tell>
  </body>
</html>
